defaults: &defaults
  machine:
    enabled: true
    image: ubuntu-2004:202111-02

base_env: &base_env
  GRUNTWORK_INSTALLER_VERSION: v0.0.38
  TERRATEST_LOG_PARSER_VERSION: v0.40.6
  HELM_VERSION: v3.8.0
  MODULE_CI_VERSION: v0.55.1
  MINIKUBE_VERSION: v1.28.0
  TERRAFORM_VERSION: NONE
  TERRAGRUNT_VERSION: NONE
  PACKER_VERSION: NONE
  GOLANG_VERSION: 1.24.0
  GO111MODULE: auto
  KUBECONFIG: /home/circleci/.kube/config

install_helm_client: &install_helm_client
  name: install helm
  command: |
    # install helm
    curl -Lo helm.tar.gz https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz
    tar -xvf helm.tar.gz
    chmod +x linux-amd64/helm
    sudo mv linux-amd64/helm /usr/local/bin/

    # Initialize stable repository
    helm repo add stable https://charts.helm.sh/stable

install_gruntwork_utils: &install_gruntwork_utils
  name: install gruntwork utils
  command: |
    curl -Ls https://raw.githubusercontent.com/gruntwork-io/gruntwork-installer/master/bootstrap-gruntwork-installer.sh | bash /dev/stdin --version "${GRUNTWORK_INSTALLER_VERSION}"
    gruntwork-install --module-name "gruntwork-module-circleci-helpers" --repo "https://github.com/gruntwork-io/terraform-aws-ci" --tag "${MODULE_CI_VERSION}"
    gruntwork-install --module-name "kubernetes-circleci-helpers" --repo "https://github.com/gruntwork-io/terraform-aws-ci" --tag "${MODULE_CI_VERSION}"
    gruntwork-install --binary-name "terratest_log_parser" --repo "https://github.com/gruntwork-io/terratest" --tag "${TERRATEST_LOG_PARSER_VERSION}"
    configure-environment-for-gruntwork-module \
      --terraform-version ${TERRAFORM_VERSION} \
      --terragrunt-version ${TERRAGRUNT_VERSION} \
      --packer-version ${PACKER_VERSION} \
      --go-version ${GOLANG_VERSION} \

integration_test_steps: &integration_test_steps
  steps:
    - attach_workspace:
        at: /home/circleci
    - run:
        <<: *install_gruntwork_utils
    - run:
        command: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y conntrack
          setup-minikube --minikube-version "${MINIKUBE_VERSION}" --k8s-version "${KUBERNETES_VERSION}" ${CRI_DOCKERD_ARG}
    - run:
        <<: *install_helm_client
    - run:
        name: run tests
        command: |
          mkdir -p /tmp/logs
          cd test
          go mod tidy
          run-go-tests --packages "-tags integration ." --timeout 60m | tee /tmp/logs/all.log
        no_output_timeout: 3600s
    - run:
        command: terratest_log_parser --testlog /tmp/logs/all.log --outputdir /tmp/logs
        when: always
    - store_artifacts:
        path: /tmp/logs
    - store_test_results:
        path: /tmp/logs

version: 2.1
jobs:
  setup:
    environment:
      <<: *base_env
    docker:
      - image: 087285199408.dkr.ecr.us-east-1.amazonaws.com/circle-ci-test-image-base:go1.21.9-tf1.5-tg39.1-pck1.8-ci54.0
    steps:
      - checkout
      # Install gruntwork utilities
      - run:
          <<: *install_gruntwork_utils
      - run:
          <<: *install_helm_client
      # Fail the build if the pre-commit hooks don't pass. Note: if you run pre-commit install locally, these hooks will
      # execute automatically every time before you commit, ensuring the build never fails at this step!
      - run:
          command: |
            pre-commit install
            pre-commit run --all-files
      - persist_to_workspace:
          root: /home/circleci
          paths:
            - project
  tpl_tests:
    <<: *defaults
    environment:
      <<: *base_env
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          <<: *install_gruntwork_utils
      - run:
          <<: *install_helm_client
      - run:
          name: run tests
          command: |
            mkdir -p /tmp/logs
            cd test
            go mod tidy
            run-go-tests --packages "-tags tpl ." --timeout 60m | tee /tmp/logs/all.log
          no_output_timeout: 3600s
      - run:
          command: terratest_log_parser --testlog /tmp/logs/all.log --outputdir /tmp/logs
          when: always
      - store_artifacts:
          path: /tmp/logs
      - store_test_results:
          path: /tmp/logs

  test_k8s124:
    <<: [*defaults, *integration_test_steps]
    environment:
      <<: *base_env
      KUBERNETES_VERSION: v1.24.8
      CRI_DOCKERD_ARG: "--cri-dockerd-version 0.3.0"
      MINIKUBE_VERSION: v1.28.0
      MODULE_CI_VERSION: v0.51.0

  test_k8s121:
    <<: [*defaults, *integration_test_steps]
    environment:
      <<: *base_env
      KUBERNETES_VERSION: v1.21.7
      CRI_DOCKERD_ARG: ""
      MINIKUBE_VERSION: v1.22.0
      MODULE_CI_VERSION: v0.50.0

  deploy:
    <<: *defaults
    environment:
      <<: *base_env
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          <<: *install_gruntwork_utils
      - run:
          <<: *install_helm_client
      - run:
          name: Generate chart packages
          command: |
            mkdir -p assets
            assets_dir="$(python -c "import os; print(os.path.abspath('./assets'))")"
            version_tag="$(echo "$CIRCLE_TAG" | sed 's/^.*-v//' | sed 's/^v//')"
            for chart in charts/*/; do
              chart_name="$(basename "$chart")"
              echo "Packaging chart ${chart_name}"
              # Update version tag
              sed -i "s/0.0.1-replace/${version_tag}/" "${chart}/Chart.yaml"
              # TODO: Figure out provenance strategy
              (cd "charts" && helm package "${chart_name}" -d "${assets_dir}")
            done
      - run:
          name: Generate chart repo index
          command: |
            cd assets
            helm repo index --url "https://github.com/gruntwork-io/helm-kubernetes-services/releases/download/${CIRCLE_TAG}" .
      - run:
          command: upload-github-release-assets ./assets/*

  open-helmcharts-pr:
    <<: *defaults
    environment:
      <<: *base_env
      GH_VERSION: "2.47.0"
      HELMCHARTS_REPO: gruntwork-io/helmcharts
    steps:
      - attach_workspace:
          at: /home/circleci
      # TEMP: remove this step before merging — allows branch builds to test this job
      # by falling back to an existing release tag when CIRCLE_TAG is not set.
      - run:
          name: Set fallback CIRCLE_TAG for branch testing
          command: |
            if [ -z "${CIRCLE_TAG}" ]; then
              echo 'export CIRCLE_TAG="v0.2.29"' >> "$BASH_ENV"
              echo "Branch build detected: using CIRCLE_TAG=v0.2.29 for testing"
            fi
      - run:
          name: Install gh CLI
          command: |
            curl -fsSLo /tmp/gh.tar.gz \
              "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
            tar -xzf /tmp/gh.tar.gz -C /tmp
            sudo mv "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
            echo "$GITHUB_OAUTH_TOKEN" | gh auth login --with-token
      - run:
          name: Clone helmcharts repo
          command: |
            git clone \
              "https://x-access-token:${GITHUB_OAUTH_TOKEN}@github.com/${HELMCHARTS_REPO}.git" \
              /tmp/helmcharts
            git -C /tmp/helmcharts config user.email "ci@gruntwork.io"
            git -C /tmp/helmcharts config user.name "gruntwork-ci"
      - run:
          name: Download release index and merge into helmcharts index
          command: |
            # Download the index.yaml already generated and uploaded by the deploy job.
            # Using the release artifact directly avoids needing to reconstruct .tgz filenames,
            # which makes this step immune to tag naming convention changes.
            gh release download "${CIRCLE_TAG}" \
              --repo gruntwork-io/helm-kubernetes-services \
              --pattern "index.yaml" \
              --dir /tmp \
              --clobber

            pip3 install --quiet -r scripts/requirements.txt

            # Merge the release index entries into the helmcharts index.
            # New versions are appended; existing versions are left unchanged (idempotent).
            python3 scripts/merge-helm-index.py \
              /tmp/index.yaml \
              /tmp/helmcharts/docs/index.yaml \
              /tmp/helmcharts/docs/index.yaml
      - run:
          name: Commit and open PR in helmcharts repo
          command: |
            BRANCH_NAME="update-helm-index-${CIRCLE_TAG}"
            DEFAULT_BRANCH="$(gh repo view "${HELMCHARTS_REPO}" --json defaultBranchRef --jq '.defaultBranchRef.name')"
            cd /tmp/helmcharts

            # Handle pre-existing remote branch (job retry scenario)
            if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" > /dev/null 2>&1; then
              echo "Branch ${BRANCH_NAME} already exists remotely, checking out."
              git fetch origin "${BRANCH_NAME}"
              git checkout -b "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
            else
              git checkout -b "${BRANCH_NAME}"
            fi

            git add docs/index.yaml

            # Exit cleanly if no changes (idempotent re-runs)
            if git diff --cached --quiet; then
              echo "index.yaml unchanged, nothing to commit."
              exit 0
            fi

            git commit -m "Update helm repo index for helm-kubernetes-services ${CIRCLE_TAG}"
            git push origin "${BRANCH_NAME}"

            # Open PR, skip if one already exists for this branch
            EXISTING_PR="$(gh pr list \
              --repo "${HELMCHARTS_REPO}" \
              --head "${BRANCH_NAME}" \
              --json number \
              --jq '.[0].number')"
            if [ -n "$EXISTING_PR" ]; then
              echo "PR #${EXISTING_PR} already exists for branch ${BRANCH_NAME}."
            else
              gh pr create \
                --repo "${HELMCHARTS_REPO}" \
                --base "${DEFAULT_BRANCH}" \
                --head "${BRANCH_NAME}" \
                --title "Update Helm repo index for helm-kubernetes-services ${CIRCLE_TAG}" \
                --body "Automated PR to update the Helm repository index after releasing \`${CIRCLE_TAG}\` of [helm-kubernetes-services](https://github.com/gruntwork-io/helm-kubernetes-services/releases/tag/${CIRCLE_TAG})."
            fi

workflows:
  test-and-deploy:
    jobs:
      - setup:
          filters:
            tags:
              only: /^(v\d|[a-z0-9-]+-v\d).*/
          context:
            - AWS__PHXDEVOPS__circle-ci-test
            - GITHUB__PAT__gruntwork-ci

      - tpl_tests:
          requires:
            - setup
          filters:
            tags:
              only: /^(v\d|[a-z0-9-]+-v\d).*/
          context:
            - AWS__PHXDEVOPS__circle-ci-test
            - GITHUB__PAT__gruntwork-ci

      - test_k8s124:
          requires:
            - setup
          filters:
            tags:
              only: /^(v\d|[a-z0-9-]+-v\d).*/
          context:
            - AWS__PHXDEVOPS__circle-ci-test
            - GITHUB__PAT__gruntwork-ci

      - test_k8s121:
          requires:
            - setup
          filters:
            tags:
              only: /^(v\d|[a-z0-9-]+-v\d).*/
          context:
            - AWS__PHXDEVOPS__circle-ci-test
            - GITHUB__PAT__gruntwork-ci

      - deploy:
          requires:
            - tpl_tests
            - test_k8s124
            - test_k8s121
          filters:
            tags:
              only: /^(v\d|[a-z0-9-]+-v\d).*/
            branches:
              ignore: /.*/
          context:
            - AWS__PHXDEVOPS__circle-ci-test
            - GITHUB__PAT__gruntwork-ci

      - open-helmcharts-pr:
          requires:
            - deploy
          filters:
            tags:
              only: /^(v\d|[a-z0-9-]+-v\d).*/
            branches:
              ignore: /.*/
          context:
            - GITHUB__PAT__gruntwork-ci

      # TEMP: remove this block before merging — runs open-helmcharts-pr on the feature branch
      # without requiring deploy, using the fallback CIRCLE_TAG set in the job.
      - open-helmcharts-pr:
          name: open-helmcharts-pr-branch-test
          requires:
            - setup
          filters:
            branches:
              only: /^ci\/fix-helmchart-publish$/
          context:
            - GITHUB__PAT__gruntwork-ci
